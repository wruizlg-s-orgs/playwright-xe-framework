name: Playwright Tests

on:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  concurrency:
    group: playwright-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

###############################################################
# API TESTS
###############################################################

jobs:

  api-tests:

    timeout-minutes: 60

    runs-on: ubuntu-latest

    env:

      ENVIRONMENT: qa

      API_URL: ${{ secrets.QA_API_URL }}

      API_USERNAME: ${{ secrets.QA_USERNAME }}

      API_PASSWORD: ${{ secrets.QA_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: TypeScript Validation
        run: npx tsc --noEmit

      - name: Run API Tests
        run: npx playwright test --project=api

      - name: Upload API Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: |
            playwright-report/
            test-results/

###############################################################
# UI TESTS
###############################################################

  ui-tests:

    timeout-minutes: 60

    runs-on: ubuntu-latest

    strategy:

      fail-fast: false

      matrix:

        browser:

          - chromium
          - firefox
          - webkit

    env:

      ENVIRONMENT: qa

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: TypeScript Validation
        run: npx tsc --noEmit

      - name: Run UI Tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/

      - name: Upload Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.browser }}
          path: test-results/

###############################################################
# SUMMARY
###############################################################

  summary:

    needs:

      - api-tests
      - ui-tests

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Publish Summary
        run: |
          echo "## Playwright Automation Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "API Tests executed." >> $GITHUB_STEP_SUMMARY
          echo "UI Tests executed in parallel." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Environment: QA" >> $GITHUB_STEP_SUMMARY