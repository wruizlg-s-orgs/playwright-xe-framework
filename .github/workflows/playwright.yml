name: Playwright Tests

permissions:
    contents: read

on:
    push:
        branches:
            - main
            - master

    pull_request:
        branches:
            - main
            - master

    workflow_dispatch:

concurrency:
    group: playwright-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

###############################################################
# API TESTS
###############################################################

jobs:
    api-tests:
        timeout-minutes: 60

        runs-on: ubuntu-latest

        env:
            ENVIRONMENT: qa

            API_URL: ${{ secrets.QA_API_URL }}

            API_USERNAME: ${{ secrets.QA_USERNAME }}

            API_PASSWORD: ${{ secrets.QA_PASSWORD }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: ESLint Validation
              run: npm run lint

            - name: TypeScript Validation
              run: npx tsc --noEmit

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run API Tests
              run: npx playwright test --project=api

            - name: Upload API Allure Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: api-allure-results
                  path: allure-results/

    ###############################################################
    # UI TESTS
    ###############################################################

    ui-tests:
        timeout-minutes: 60

        runs-on: ubuntu-latest

        strategy:
            fail-fast: false

            matrix:
                browser:
                    - chromium
                    - firefox
                    - webkit

        env:
            ENVIRONMENT: qa

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: ESLint Validation
              run: npm run lint

            - name: TypeScript Validation
              run: npx tsc --noEmit

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run UI Tests
              run: npx playwright test --project=${{ matrix.browser }}

            - name: Upload UI Allure Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.browser }}-allure-results

                  path: allure-results/

            - name: Upload Failure Evidence
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: evidence-${{ matrix.browser }}

                  path: test-results/

    ###############################################################
    # ALLURE REPORT
    ###############################################################

    allure-report:
        needs:
            - api-tests
            - ui-tests

        if: always()

        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download API Allure Results
              uses: actions/download-artifact@v4

              with:
                  pattern: api-allure-results

                  path: allure-results

                  merge-multiple: true

            - name: Download UI Allure Results
              uses: actions/download-artifact@v4

              with:
                  pattern: '*-allure-results'

                  path: allure-results

                  merge-multiple: true

            - name: Debug Allure Results
              run: |

                  echo "=============================="

                  echo "ALLURE FILES"

                  echo "=============================="

                  find allure-results -type f | head -50


                  echo ""

                  echo "RESULT JSON COUNT"

                  find allure-results -name "*-result.json" | wc -l

            - name: Setup Java
              uses: actions/setup-java@v4

              with:
                  distribution: temurin

                  java-version: 17

            - name: Install Allure
              run: npm install -g allure-commandline

            - name: Generate Allure Report
              run: |

                  allure generate allure-results --clean -o allure-report

            - name: Upload Allure Report
              uses: actions/upload-artifact@v4

              with:
                  name: allure-report

                  path: allure-report/

    ###############################################################
    # SUMMARY
    ###############################################################

    summary:
        needs:
            - api-tests
            - ui-tests
            - allure-report

        if: always()

        runs-on: ubuntu-latest

        steps:
            - name: Publish Summary
              run: |

                  echo "## Playwright Automation Pipeline" >> $GITHUB_STEP_SUMMARY

                  echo "" >> $GITHUB_STEP_SUMMARY

                  echo "API Tests executed." >> $GITHUB_STEP_SUMMARY

                  echo "UI Tests executed in parallel." >> $GITHUB_STEP_SUMMARY

                  echo "" >> $GITHUB_STEP_SUMMARY

                  echo "Environment: QA" >> $GITHUB_STEP_SUMMARY
