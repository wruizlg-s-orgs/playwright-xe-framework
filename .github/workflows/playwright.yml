name: Playwright Tests

permissions:
    contents: write

on:
    push:
        branches:
            - main
            - master

    pull_request:
        branches:
            - main
            - master

    workflow_dispatch:

concurrency:
    group: playwright-${{ github.workflow }}-${{ github.ref }}

    cancel-in-progress: true

jobs:
    ###############################################################
    # API TESTS
    ###############################################################

    api-tests:
        timeout-minutes: 60

        runs-on: ubuntu-latest

        env:
            ENVIRONMENT: qa

            API_URL: ${{ secrets.QA_API_URL }}

            API_USERNAME: ${{ secrets.QA_USERNAME }}

            API_PASSWORD: ${{ secrets.QA_PASSWORD }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4

              with:
                  node-version: 22

                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: ESLint Validation
              run: npm run lint

            - name: TypeScript Validation
              run: npx tsc --noEmit

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run API Tests
              run: npx playwright test --project=api

            - name: Upload API Allure Results

              if: always()

              uses: actions/upload-artifact@v4

              with:
                  name: api-allure-results

                  path: allure-results/

    ###############################################################
    # UI TESTS
    ###############################################################

    ui-tests:
        timeout-minutes: 60

        runs-on: ubuntu-latest

        strategy:
            fail-fast: false

            matrix:
                browser:
                    - chromium
                    - firefox
                    - webkit

        env:
            ENVIRONMENT: qa

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4

              with:
                  node-version: 22

                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: ESLint Validation
              run: npm run lint

            - name: TypeScript Validation
              run: npx tsc --noEmit

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run UI Tests

              run: npx playwright test --project=${{ matrix.browser }}

            - name: Upload UI Allure Results

              if: always()

              uses: actions/upload-artifact@v4

              with:
                  name: ${{ matrix.browser }}-allure-results

                  path: allure-results/

            - name: Upload Failure Evidence

              if: failure()

              uses: actions/upload-artifact@v4

              with:
                  name: evidence-${{ matrix.browser }}

                  path: test-results/

    ###############################################################
    # GENERATE ALLURE REPORT
    ###############################################################

    allure-report:
        needs:
            - api-tests

            - ui-tests

        if: always()

        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository

              uses: actions/checkout@v4

            - name: Setup Node

              uses: actions/setup-node@v4

              with:
                  node-version: 22

                  cache: npm

            - name: Install dependencies

              run: npm ci

            ###############################################################
            # DOWNLOAD RESULTS
            ###############################################################

            - name: Prepare Allure Directory

              run: mkdir -p allure-results

            - name: Download API Results

              uses: actions/download-artifact@v4

              with:
                  pattern: api-allure-results

                  path: allure-results

                  merge-multiple: true

            - name: Download UI Results

              uses: actions/download-artifact@v4

              with:
                  pattern: '*-allure-results'

                  path: allure-results

                  merge-multiple: true

            ###############################################################
            # RESTORE HISTORY
            ###############################################################

            - name: Restore Allure History

              run: |


                  mkdir -p allure-results/history


                  git fetch origin gh-pages || true


                  git checkout origin/gh-pages -- history || true


                  if [ -d history ]; then

                    cp -r history/* allure-results/history/

                  fi

            ###############################################################
            # METADATA
            ###############################################################

            - name: Create Allure Metadata

              run: |


                  cat <<EOF > allure-results/environment.properties

                  Environment=QA

                  Framework=Playwright

                  Language=TypeScript

                  Browser=Multiple

                  CI=GitHub Actions

                  EOF



                  cat <<EOF > allure-results/executor.json

                  {
                    "name": "GitHub Actions",
                    "type": "github",
                    "buildOrder": ${{ github.run_number }},
                    "buildName": "${{ github.workflow }}",
                    "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "reportName": "Playwright Automation Report"
                  }

                  EOF

            ###############################################################
            # CATEGORIES
            ###############################################################

            - name: Add Allure Categories

              run: |


                  cp allure-config/categories.json allure-results/categories.json

            ###############################################################
            # DEBUG
            ###############################################################

            - name: Debug Allure

              run: |


                  echo "RESULT COUNT"


                  find allure-results -name "*-result.json" | wc -l



                  echo "HISTORY"


                  ls -la allure-results/history || true

            ###############################################################
            # GENERATE REPORT
            ###############################################################

            - name: Setup Java

              uses: actions/setup-java@v4

              with:
                  distribution: temurin

                  java-version: 17

            - name: Install Allure

              run: npm install -g allure-commandline

            - name: Generate Allure Report

              run: |


                  allure generate allure-results \
                  --clean \
                  -o allure-report

            - name: Upload Allure Artifact

              uses: actions/upload-artifact@v4

              with:
                  name: allure-report

                  path: allure-report/

    ###############################################################
    # PUBLISH GH-PAGES
    ###############################################################

    publish-allure:
        needs:
            - allure-report

        if: always()

        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository

              uses: actions/checkout@v4

            - name: Download Allure Report

              uses: actions/download-artifact@v4

              with:
                  name: allure-report

                  path: allure-report

            - name: Deploy Allure Report to GitHub Pages

              uses: peaceiris/actions-gh-pages@v4

              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}

                  publish_dir: ./allure-report

                  publish_branch: gh-pages

                  force_orphan: false

    ###############################################################
    # SUMMARY
    ###############################################################

    summary:
        needs:
            - api-tests

            - ui-tests

            - allure-report

            - publish-allure

        if: always()

        runs-on: ubuntu-latest

        steps:
            - name: Publish Summary

              run: |


                  echo "## Playwright Automation Pipeline" >> $GITHUB_STEP_SUMMARY


                  echo "" >> $GITHUB_STEP_SUMMARY


                  echo "✅ API Tests executed." >> $GITHUB_STEP_SUMMARY


                  echo "✅ UI Tests executed in parallel." >> $GITHUB_STEP_SUMMARY


                  echo "" >> $GITHUB_STEP_SUMMARY


                  echo "Environment: QA" >> $GITHUB_STEP_SUMMARY


                  echo "" >> $GITHUB_STEP_SUMMARY


                  echo "Allure Report:" >> $GITHUB_STEP_SUMMARY


                  echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
