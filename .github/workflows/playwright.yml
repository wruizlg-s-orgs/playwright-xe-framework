name: Playwright Tests


on:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master



jobs:

  test:

    timeout-minutes: 60

    runs-on: ubuntu-latest


    env:

      ENVIRONMENT: qa

      API_URL: ${{ secrets.QA_API_URL }}

      API_USERNAME: ${{ secrets.QA_USERNAME }}

      API_PASSWORD: ${{ secrets.QA_PASSWORD }}


    steps:


    - name: Checkout repository

      uses: actions/checkout@v4



    - name: Setup Node.js

      uses: actions/setup-node@v4

      with:

        node-version: 22

        cache: npm



    - name: Install dependencies

      run: npm ci



    - name: Install Playwright Browsers

      run: npx playwright install --with-deps



    #
    # QUALITY GATES
    #

    - name: TypeScript Validation

      run: npx tsc --noEmit



    #
    # TEST EXECUTION
    #

    - name: Smoke Tests

      if: github.event_name == 'pull_request'

      run: npm run test:smoke



    - name: Regression Tests

      if: github.event_name == 'push'

      run: npm run test:regression



    #
    # REPORTS
    #

    - name: Upload Playwright Report

      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: playwright-report

        path: |
          playwright-report/
          test-results/

        retention-days: 30



    #
    # FAILURE EVIDENCE
    #

    - name: Upload Failure Evidence

      if: failure()

      uses: actions/upload-artifact@v4

      with:

        name: failure-evidence

        path:

          test-results/

        retention-days: 14



    #
    # SUMMARY
    #

    - name: Publish Summary

      if: always()

      run: |

        echo "## Playwright Automation Pipeline" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "Environment: QA" >> $GITHUB_STEP_SUMMARY

        echo "Tests executed using Playwright." >> $GITHUB_STEP_SUMMARY
