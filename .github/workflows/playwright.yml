name: Playwright Tests


on:

  push:
    branches: [ main, master ]

  pull_request:
    branches: [ main, master ]



jobs:


  test:


    timeout-minutes: 60


    runs-on: ubuntu-latest



    steps:


    # =========================
    # CHECKOUT
    # =========================

    - name: Checkout repository
      uses: actions/checkout@v4



    # =========================
    # NODE SETUP
    # =========================

    - name: Setup Node.js
      uses: actions/setup-node@v4

      with:
        node-version: 22
        cache: npm



    # =========================
    # INSTALL
    # =========================

    - name: Install dependencies
      run: npm ci



    - name: Install Playwright Browsers
      run: npx playwright install --with-deps



    # =========================
    # QUALITY GATE
    # =========================

    - name: Type check
      run: npx tsc --noEmit



    # =========================
    # TEST EXECUTION
    # =========================

    - name: Run Smoke Tests

      if: github.event_name == 'pull_request'

      run: npm run test:smoke



    - name: Run Regression Tests

      if: github.event_name == 'push'

      run: npm run test:regression




    # =========================
    # REPORT VISIBILITY
    # =========================


    - name: Upload Playwright HTML Report

      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: playwright-html-report

        path: |
          playwright-report/
          test-results/
          
        retention-days: 30





    # =========================
    # FAILURE DEBUGGING
    # =========================


    - name: Upload Test Evidence

      if: failure()

      uses: actions/upload-artifact@v4

      with:

        name: playwright-test-evidence

        path: |
          test-results/
          playwright-report/

        retention-days: 14





    # =========================
    # GITHUB SUMMARY
    # =========================


    - name: Publish Test Summary

      if: always()

      run: |

        echo "## Playwright Test Execution" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "Automated tests executed successfully through GitHub Actions." >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "Environment: CI Pipeline" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "HTML report and evidence are available in the workflow artifacts." >> $GITHUB_STEP_SUMMARY